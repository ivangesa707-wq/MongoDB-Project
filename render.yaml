services:
  - type: web
    name: gesaivan-market
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: gesaivan_market
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
